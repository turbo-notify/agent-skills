[tool.poetry]
name = "turbo-notify-agent-skills"
version = "0.1.0"
description = "Agent skills for the Turbo Notify MCP server (development tooling only; the shipped helper has no dependencies)."
authors = ["Turbo Notify"]
license = "MIT"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.9,<4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
ruff = "^0.8"
mypy = "^1.13"
hypothesis = "^6.115"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["skills/virtual-attendant/scripts"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["UP006", "UP007", "UP035", "UP045"]

[tool.mypy]
python_version = "3.9"
strict = true
files = ["skills/virtual-attendant/scripts"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
